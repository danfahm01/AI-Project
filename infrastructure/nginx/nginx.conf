# Development reverse proxy (docker compose): plain HTTP on :80.
#
# Production uses the web image (infrastructure/docker/web.Dockerfile) with
# templates/default.conf.template instead: HTTPS/WSS only, HTTP redirects to
# HTTPS. Both include the same snippets/ (API proxy, web app, headers).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    include /etc/nginx/snippets/http-common.conf;

    # Hosts the browser app may connect to directly (voice mode), see static-headers.conf.
    map $scheme $csp_connect_src {
        default "https://api.openai.com wss://generativelanguage.googleapis.com";
    }

    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/app-locations.conf;
    }
}
