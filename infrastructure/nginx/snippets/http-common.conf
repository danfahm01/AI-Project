# http-level settings shared by the development (nginx.conf) and production
# (templates/default.conf.template) configurations.

server_tokens off;

# Upload ceiling (attachments). Keep it above ATTACHMENT_MAX_BYTES plus multipart overhead.
client_max_body_size 25m;

# Edge rate limit as a first line of defence; the API applies finer per-user limits.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# WebSocket upgrades get "Connection: upgrade"; other requests send no Connection
# header, so upstream keep-alive connections are reused.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# HSTS only over HTTPS (browsers ignore it on plain HTTP anyway).
map $scheme $hsts {
    https   "max-age=63072000";
    default "";
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

# Compression. The web image ships precompressed .gz files (gzip_static); other
# responses are compressed on the fly. Auth and voice-session responses are
# excluded in app-locations.conf (they carry tokens: BREACH).
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain;
