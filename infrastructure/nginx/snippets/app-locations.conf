# Locations shared by the development and production servers.

# --- API -----------------------------------------------------------------------

# Streaming chat WebSocket: long-lived (the app pings every 25 s).
location = /api/v1/chat/ws {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-backend.conf;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Responses that contain tokens or client secrets are never compressed (BREACH).
location ~ ^/api/v1/(auth|voice)/ {
    limit_req zone=api burst=40 nodelay;
    gzip off;
    include /etc/nginx/snippets/proxy-backend.conf;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-backend.conf;
}

# Interactive API docs (disabled in production unless ENABLE_API_DOCS=true).
location ~ ^/(docs|redoc|openapi\.json)$ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-backend.conf;
}

# Health probes: not rate limited.
location /health/ {
    include /etc/nginx/snippets/proxy-backend.conf;
}

# --- Flutter web app ----------------------------------------------------------------
# Built with --web-content-hash: entrypoints and assets/ carry a content hash in
# their names and can be cached forever. index.html, flutter_bootstrap.js and
# canvaskit/ keep fixed names and are revalidated (ETag) on every load, so a new
# deploy is picked up immediately.

location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    include /etc/nginx/snippets/static-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/main\.dart\.[A-Za-z0-9_-]+\.(js|mjs|wasm)$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    include /etc/nginx/snippets/static-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    root /usr/share/nginx/html;
    # The app uses hash URLs (/#/chat/...), so unknown paths fall back to the app.
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/static-headers.conf;
    add_header Cache-Control "no-cache" always;
}
