# Headers for the Flutter web app's static files. Included in every location
# that sets its own add_header (nginx does not inherit add_header into those).
#
# Content-Security-Policy, matching a build made with
#   flutter build web --no-web-resources-cdn --csp
# - 'wasm-unsafe-eval': CanvasKit is WebAssembly. No 'unsafe-eval' is needed (--csp).
# - 'unsafe-inline' styles: the Flutter engine injects <style> elements.
# - fonts.gstatic.com: Flutter downloads fallback fonts (emoji, scripts the
#   bundled fonts lack) from Google Fonts at runtime.
# - $csp_connect_src: direct connections from the browser to the AI providers
#   for voice mode (OpenAI WebRTC SDP exchange, Gemini Live WebSocket).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com $csp_connect_src; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security $hsts always;
