# Proxy a request to the FastAPI backend.
proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Nginx is the edge: overwrite (never append to) the client's X-Forwarded-For.
# The backend trusts this header for rate limiting, so a client-supplied value
# must not survive. Behind a load balancer or CDN, configure real_ip
# (set_real_ip_from / real_ip_header) so $remote_addr is the real client.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
