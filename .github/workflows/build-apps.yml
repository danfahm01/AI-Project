# Builds the app for every platform. Runs on changes to the app, on demand, and
# from release.yml (which publishes the artifacts).
#
# API_BASE_URL is compiled into the apps. Pull-request builds use a placeholder;
# releases use the repository variable API_BASE_URL (Settings → Secrets and
# variables → Actions → Variables), which must be an https:// URL.
#
# Optional repository secrets for a Play-ready Android build (otherwise the
# release APK/AAB is signed with a debug key, see docs/setup.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build apps

on:
  pull_request:
    paths: ["apps/flutter_app/**", ".github/workflows/build-apps.yml"]
  push:
    branches: [main]
    paths: ["apps/flutter_app/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL compiled into the apps (https://...)"
        required: true
        default: "https://api.example.com"
  workflow_call:
    inputs:
      api_base_url:
        type: string
        required: true
      build_name:
        description: "Version shown to users, e.g. 1.2.3"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0
  API_BASE_URL: ${{ inputs.api_base_url || 'https://api.example.com' }}
  # Version: the release tag (via build_name) or pubspec.yaml; build number: the run number.
  BUILD_ARGS: >-
    --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://api.example.com' }}
    --build-number=${{ github.run_number }}
    ${{ inputs.build_name && format('--build-name={0}', inputs.build_name) || '' }}

jobs:
  check-url:
    name: Check API_BASE_URL
    runs-on: ubuntu-24.04
    steps:
      - name: Apps must talk to the backend over HTTPS
        run: |
          case "$API_BASE_URL" in
            https://*) echo "API_BASE_URL=$API_BASE_URL" ;;
            *) echo "::error::API_BASE_URL must start with https:// (got '$API_BASE_URL')"; exit 1 ;;
          esac

  android:
    name: Android (APK per ABI + App Bundle)
    needs: check-url
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Android lint (AGP 9) calls List.removeLast(), which needs Java 21.
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release signing key (when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: release builds are signed with a debug key (not accepted by Google Play)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi $BUILD_ARGS
      - run: flutter build appbundle --release $BUILD_ARGS
      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            apps/flutter_app/build/app/outputs/flutter-apk/app-*-release.apk
            apps/flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: check-url
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.BUILD_ARGS }}
      - name: Bundle the Visual C++ runtime and zip
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          # The app needs the VC++ runtime; ship it next to the .exe so users need no installer.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          Compress-Archive -Path "$release\*" -DestinationPath voice-assistant-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: apps/flutter_app/voice-assistant-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (x64)
    needs: check-url
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        # Flutter's Linux toolchain, plus libsecret (secure token storage) and
        # PulseAudio headers (flutter_webrtc).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev \
            libsecret-1-dev libpulse-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release $BUILD_ARGS
      - run: tar -C build/linux/x64/release/bundle -czf voice-assistant-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: apps/flutter_app/voice-assistant-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (unsigned)
    needs: check-url
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release $BUILD_ARGS
      - name: Zip the app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/voice_assistant.app voice-assistant-macos-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: apps/flutter_app/voice-assistant-macos-unsigned.zip
          if-no-files-found: error

  ios:
    name: iOS (compile check, no code signing)
    needs: check-url
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # An installable .ipa needs an Apple Developer account: see docs/setup.md (iOS).
      - run: flutter build ios --release --no-codesign $BUILD_ARGS

  web:
    name: Web (static bundle, same-origin API)
    needs: check-url
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # "/" = served by the web image next to the API (see docs/deployment.md).
      - run: >-
          flutter build web --release --no-web-resources-cdn --web-content-hash --csp
          --dart-define=API_BASE_URL=/ --build-number=${{ github.run_number }}
          ${{ inputs.build_name && format('--build-name={0}', inputs.build_name) || '' }}
      - run: tar -C build/web -czf voice-assistant-web.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/flutter_app/voice-assistant-web.tar.gz
          if-no-files-found: error
