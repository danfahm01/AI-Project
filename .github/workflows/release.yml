# Release: push a tag such as v1.2.0.
#   git tag v1.2.0 && git push origin v1.2.0
#
# Builds every app (build-apps.yml) against the repository variable API_BASE_URL,
# pushes the backend and web images to GitHub Container Registry, and creates a
# GitHub release with the app files. See docs/deployment.md (Releases).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    name: Version from tag
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! echo "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  apps:
    name: Apps
    needs: version
    uses: ./.github/workflows/build-apps.yml
    with:
      api_base_url: ${{ vars.API_BASE_URL }}
      build_name: ${{ needs.version.outputs.name }}
    secrets: inherit

  images:
    name: Docker images (GHCR)
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: web
            context: .
            file: ./infrastructure/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: GitHub release
    needs: [apps, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Voice Assistant $GITHUB_REF_NAME"
