name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, coverage, migrations, dependency audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assistant
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Runs the rate-limiter integration tests against the real Redis service.
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Migrations upgrade and downgrade cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://assistant:ci-password@localhost:5432/assistant
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Known vulnerabilities in the installed dependencies
        run: pip-audit --progress-spinner off

  flutter:
    name: Flutter (analyze, test, web build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: dart format --line-length 120 --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Production web build (same flags as the web image)
        run: flutter build web --release --no-web-resources-cdn --web-content-hash --csp --dart-define=API_BASE_URL=/
      - name: Plugin scripts that voice mode loads by a fixed name are present
        run: |
          dart run tool/fixed_name_web_assets.dart build/web
          test -f build/web/assets/packages/record_web/assets/js/record.worklet.js
          test -f build/web/assets/packages/mp_audio_stream/js/audio_stream.js

  deployment:
    name: Docker deployment (production stack over HTTPS, smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compose files are valid
        run: |
          POSTGRES_PASSWORD=ci JWT_SECRET=ci-secret docker compose --env-file .env.example config --quiet
          POSTGRES_PASSWORD=ci JWT_SECRET=ci-secret SERVER_NAME=localhost \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Development Nginx configuration is valid
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infrastructure/nginx/snippets:/etc/nginx/snippets:ro" \
            nginx:1.30-alpine nginx -t
      - name: Configuration and a self-signed certificate (test only)
        run: |
          {
            echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            echo "SERVER_NAME=localhost"
            echo "ENABLE_API_DOCS=false"
          } > .env
          sh infrastructure/scripts/make-dev-cert.sh localhost
      - name: Build and start the production stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180
      - name: Production Nginx configuration is valid
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -t
      - name: Smoke test through Nginx (HTTPS, WSS, web app, rate limit)
        run: |
          pip install httpx==0.28.1 websockets==17.4
          python backend/scripts/smoke_test.py --base-url https://localhost --insecure \
            --web --http-url http://localhost --chat --check-rate-limit
      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
