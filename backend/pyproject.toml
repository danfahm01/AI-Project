[project]
name = "voice-assistant-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Known: google-genai flags its (preview) ephemeral-token support as experimental.
    "ignore:The SDK's token creation implementation is experimental",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # the ellipsis character in derived titles is intentional
]

[tool.ruff.lint.isort]
# The local "alembic/" migrations folder would otherwise make ruff treat alembic as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hard-coded test passwords
