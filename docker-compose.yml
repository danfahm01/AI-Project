# Local stack: PostgreSQL + Redis + FastAPI backend + Nginx (plain HTTP).
#   cp .env.example .env   # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up --build
# API: http://localhost/api/v1  ·  Docs: http://localhost/docs
#
# Production (HTTPS, web app, hardened settings): add the overlay, see docs/deployment.md
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Rate-limit counters only: no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Set BACKEND_IMAGE to a released image (ghcr.io/<owner>/<repo>/backend:<version>)
    # and run `docker compose pull` + `up -d --no-build` to skip building on the server.
    image: ${BACKEND_IMAGE:-voice-assistant-backend}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assistant}
      REDIS_URL: redis://redis:6379/0
      # Required: the API runs several workers, which must share one signing key.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      # The backend publishes no port: only Nginx (on this network) can reach it, and
      # Nginx overwrites X-Forwarded-For, so trusting the proxy headers is safe here.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - attachments-data:/app/data/attachments
    # Hardening: no writable image filesystem (uploads spool to /tmp), no privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Longer than uvicorn's --timeout-graceful-shutdown (20 s), so replies in
    # progress are saved as "cancelled" before the container is killed.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      # Optional: serve a local Flutter web build at http://localhost/
      # (flutter build web --no-web-resources-cdn --web-content-hash --csp --dart-define=API_BASE_URL=/)
      # - ./apps/flutter_app/build/web:/usr/share/nginx/html:ro
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  attachments-data:
